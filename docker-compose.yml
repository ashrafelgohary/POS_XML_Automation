services:
  nginx:
    image: nginx:1.27-alpine
    container_name: pos-xml-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx

    depends_on:
      gui-upload:
        condition: service_healthy

    networks:
      - pos-automation

    security_opt:
      - no-new-privileges:true

  ansible-runner:
    build:
      context: .
      dockerfile: ansible/Dockerfile
    image: pos-xml-automation-ansible:latest
    container_name: pos-xml-ansible
    restart: unless-stopped

    environment:
      PROJECT_ROOT: /app
      ANSIBLE_INVENTORY: /app/inventory/hosts.yml
      ANSIBLE_PLAYBOOK: /app/ansible/site.yml
      STAGING_SCRIPT: /app/scripts/stage_pos_xmls.py
      INCOMING_DIRECTORY: /app/incoming/new
      LOG_DIRECTORY: /app/logs
      RUNNER_API_TOKEN: ${RUNNER_API_TOKEN:?RUNNER_API_TOKEN is required}
      ANSIBLE_HOST_KEY_CHECKING: "False"

    volumes:
      - ./ansible:/app/ansible
      - ./scripts:/app/scripts
      - ./inventory:/app/inventory
      - ./incoming:/app/incoming
      - ./pos-configs:/app/pos-configs
      - ./logs:/app/logs
      - ./.vault_pass:/app/.vault_pass:ro

    # No external ports - internal only
    expose:
      - "8000"

    networks:
      - pos-automation

    security_opt:
      - no-new-privileges:true

  gui-upload:
    build:
      context: .
      dockerfile: gui_upload/Dockerfile
    image: pos-xml-automation-gui:latest
    container_name: pos-xml-gui
    restart: unless-stopped

    depends_on:
      ansible-runner:
        condition: service_healthy

    environment:
      ANSIBLE_API_URL: http://ansible-runner:8000
      RUNNER_API_TOKEN: ${RUNNER_API_TOKEN:?RUNNER_API_TOKEN is required}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?FLASK_SECRET_KEY is required}
      UPLOAD_DIRECTORY: /app/incoming/new
      LOG_DIRECTORY: /app/logs
      MAX_UPLOAD_MB: "10"
      REQUEST_TIMEOUT_SECONDS: "1800"
      COMPANY_NAME: "Alshaya Group"
      APP_TITLE: "POS XML Automation"
      ENVIRONMENT_NAME: "Production"
      SESSION_COOKIE_SECURE: "true"

    # No external ports - only Nginx can reach it
    expose:
      - "5000"

    volumes:
      - ./incoming:/app/incoming
      - ./logs:/app/logs:ro

    networks:
      - pos-automation

    security_opt:
      - no-new-privileges:true

networks:
  pos-automation:
    driver: bridge
    name: pos-automation
