# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name pos.alshaya.local;

    # Allow health checks over HTTP
    location /health {
        proxy_pass http://gui-upload:5000/health;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name pos.alshaya.local;

    # SSL certificates
    ssl_certificate     /etc/nginx/ssl/pos.crt;
    ssl_certificate_key /etc/nginx/ssl/pos.key;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Upload size limit
    client_max_body_size 15M;

    # Proxy to GUI
    location / {
        proxy_pass http://gui-upload:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long Ansible runs
        proxy_connect_timeout 60s;
        proxy_send_timeout 1900s;
        proxy_read_timeout 1900s;
    }

    # Access logs
    access_log /var/log/nginx/pos-access.log;
    error_log  /var/log/nginx/pos-error.log;
}
